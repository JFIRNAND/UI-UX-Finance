<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Masuk — KaitoFin</title>
  <meta name="theme-color" content="#08120F" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/mobile.css" />
</head>
<body>
<div class="login-page-m">

  <!-- Branding hero -->
  <div class="login-hero-m" role="banner">
    <img class="login-wordmark" src="../../assets/kaitofin-wordmark.png" alt="KaitoFin Financial" width="651" height="250" />
    <div class="login-tagline-m">Kelola keuangan pribadi &amp; bisnis dengan AI</div>
  </div>

  <!-- Form -->
  <main class="login-form-section-m" id="main-content" aria-label="Form login KaitoFin">
    <div>
      <h1 class="login-title-m">Selamat datang</h1>
      <p class="login-subtitle-m">Masuk ke akun KaitoFin kamu</p>
    </div>

    <form action="dashboard.html" method="get" novalidate aria-label="Form masuk akun" style="display:flex;flex-direction:column;gap:16px">
      <!-- Email -->
      <div class="login-form-group-m">
        <label for="email" class="login-label-m">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="login-input-m"
          placeholder="nama@email.com"
          autocomplete="email"
          aria-required="true"
          aria-describedby="email-hint"
        />
        <span id="email-hint" class="sr-only">Masukkan alamat email yang terdaftar</span>
      </div>

      <!-- Password -->
      <div class="login-form-group-m">
        <label for="password" class="login-label-m">Password</label>
        <div style="position:relative">
          <input
            type="password"
            id="password"
            name="password"
            class="login-input-m"
            placeholder="Masukkan password"
            autocomplete="current-password"
            aria-required="true"
            style="padding-right:56px"
          />
          <button
            type="button"
            id="toggle-pw"
            aria-label="Tampilkan password"
            aria-pressed="false"
            onclick="togglePassword()"
            style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#3E5C55;cursor:pointer;padding:8px;border-radius:8px;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px"
          >
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M1.5 9s2.7-6 7.5-6 7.5 6 7.5 6-2.7 6-7.5 6-7.5-6-7.5-6z" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="9" cy="9" r="2.2" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </button>
        </div>
        <div style="text-align:right;margin-top:6px">
          <a href="#" style="font-size:12px;color:#2BBFA0;text-decoration:none;font-weight:600">Lupa password?</a>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="mobile-btn-primary" style="margin-top:4px" aria-label="Masuk ke KaitoFin">
        Masuk
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
          <path d="M3.5 8.5h10M9 4l4.5 4.5L9 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <div class="login-alt-link-m">
      Belum punya akun? <a href="#" aria-label="Daftar akun KaitoFin baru">Daftar gratis</a>
    </div>

    <!-- Back to landing -->
    <div style="text-align:center;padding-top:4px">
      <a href="../../index.html" style="font-size:12px;color:#2E4C45;text-decoration:none;display:inline-flex;align-items:center;gap:5px;padding:8px;min-height:40px">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
          <path d="M8 3l-4 3.5 4 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Kembali ke beranda
      </a>
    </div>
  </main>

</div>

<script>
function togglePassword() {
  const input = document.getElementById('password');
  const btn   = document.getElementById('toggle-pw');
  const icon  = document.getElementById('eye-icon');
  const show  = input.type === 'password';

  input.type = show ? 'text' : 'password';
  btn.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  btn.setAttribute('aria-pressed', show ? 'true' : 'false');

  if (show) {
    icon.innerHTML = `
      <path d="M1.5 9s2.7-6 7.5-6 7.5 6 7.5 6-2.7 6-7.5 6-7.5-6-7.5-6z" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="9" cy="9" r="2.2" stroke="currentColor" stroke-width="1.4"/>
      <path d="M2 2l14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>`;
  } else {
    icon.innerHTML = `
      <path d="M1.5 9s2.7-6 7.5-6 7.5 6 7.5 6-2.7 6-7.5 6-7.5-6-7.5-6z" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="9" cy="9" r="2.2" stroke="currentColor" stroke-width="1.4"/>`;
  }
}
</script>
</body>
</html>
